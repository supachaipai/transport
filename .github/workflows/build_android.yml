name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Flutter information
        run: |
          flutter --version
          dart --version
          java -version

      - name: Prepare Android project
        run: |
          chmod +x tool/setup_project.sh
          ./tool/setup_project.sh

      # Extra safety for AGP 9. If an older cached inappwebview Android subpackage
      # is ever selected, replace the removed ProGuard default automatically.
      - name: AGP 9 WebView compatibility safety patch
        shell: bash
        run: |
          set -e
          echo "Checking flutter_inappwebview Android Gradle files..."
          find "$HOME/.pub-cache" -type f -path '*/flutter_inappwebview_android-*/android/build.gradle' -print | while read -r f; do
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
            echo "Patched: $f"
          done

      - name: Clean and get packages
        run: |
          flutter clean
          flutter pub get

      - name: Build debug APK first
        run: flutter build apk --debug

      - name: Build release APK
        id: release_build
        continue-on-error: true
        run: flutter build apk --release

      - name: Upload Android APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-khonsong-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build result note
        if: always()
        run: |
          echo "Debug APK is the guaranteed test/install package."
          echo "Release step outcome: ${{ steps.release_build.outcome }}"
