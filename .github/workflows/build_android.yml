name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Prepare Android project
        run: |
          chmod +x tool/setup_project.sh
          ./tool/setup_project.sh

      - name: Get packages again
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-khonsong-apk
          path: build/app/outputs/flutter-apk/app-release.apk
