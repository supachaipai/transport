name: appkhonsong
description: แอพขนส่ง - Mobile shell for the v19 transport management system.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 6.2.0-beta.3 includes Android Gradle Plugin 9 compatibility fixes.
  flutter_inappwebview: 6.2.0-beta.3
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  dio: ^5.7.0
  open_filex: 4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/app_icon_1024.png
    - assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon_1024.png
  adaptive_icon_background: '#0B5BD3'
  adaptive_icon_foreground: assets/images/app_icon_1024.png

flutter_native_splash:
  color: '#F8FAFC'
  image: assets/images/app_logo.png
  android: true
  ios: true
  android_12:
    color: '#F8FAFC'
    image: assets/images/app_icon_1024.png
